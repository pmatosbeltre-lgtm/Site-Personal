<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="preload" href="./CSS/styles.css" as="style" />
    <link rel="stylesheet" href="./CSS/styles.css">
</head>
<body>
    <div class="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3>Menú</h3>
            </div>
            <ul class="menu list-unstyled components">
                <li><a href="index.html">Home</a></li>
                <li><a href="Valores.html">Valores</a></li>
                <li><a href="Skills.html">Habilidades</a></li>
                <li><a href="Proyectos.html">Proyectos</a></li>
                <li><a href="Contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div id="content">
            <header class="top-bar">
                <button type="button" id="sidebarCollapse" class="btn-menu"></button>
                <h2>Portafolio</h2>
                <button type="button" onclick="window.location.href='index.html'"> back to Home </button>
            </header>
            <main class="main-body" id="contenedor-principal">
                <div class="card">
                    <h2>Contacto</h2>
                    <p>Si deseas ponerte en contacto conmigo, puedes hacerlo a través del formulario de contacto:</p>
                    <form>
                        <div class="form-group">
                            <label for="name">Nombre:</label>
                            <input type="text" class="form-control" id="name" placeholder="Tu nombre">
                        </div>
                        <div class="form-group">
                            <label for="lastname">Apellido:</label>
                            <input type="text" class="form-control" id="lastname" placeholder="Tu apellido">
                        </div>
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" class="form-control" id="email" placeholder="Tu email">
                        </div>
                        <div class="form-group">
                            <label for="message">Servicio deseado:</label>
                            <textarea class="form-control" id="message" rows="5" placeholder="Tu mensaje"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Enviar</button>
                    </form>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
